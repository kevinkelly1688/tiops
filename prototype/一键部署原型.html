<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>安装部署 · 一键部署原型</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{--surface-0:#faf9f5;--surface-1:#f3f1ea;--surface-2:#ffffff;--border:rgba(0,0,0,.12);--border-strong:rgba(0,0,0,.28);--border-accent:#378ADD;--text-primary:#1f1e1d;--text-secondary:#5f5e5a;--text-muted:#8a8982;--text-accent:#185FA5;--text-success:#3B6D11;--text-warning:#854F0B;--text-danger:#A32D2D;--bg-accent:#E6F1FB;--bg-success:#EAF3DE;--bg-warning:#FAEEDA;--bg-danger:#FCEBEB;--radius:8px;--font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--surface-0:#1f1e1d;--surface-1:#2a2927;--surface-2:#30302e;--border:rgba(255,255,255,.14);--border-strong:rgba(255,255,255,.3);--border-accent:#85B7EB;--text-primary:#f1efe8;--text-secondary:#b4b2a9;--text-muted:#888780;--text-accent:#B5D4F4;--text-success:#C0DD97;--text-warning:#FAC775;--text-danger:#F7C1C1;--bg-accent:#0C447C;--bg-success:#27500A;--bg-warning:#633806;--bg-danger:#791F1F}}
body{margin:0;background:var(--surface-0);color:var(--text-primary);font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:780px;margin:0 auto;padding:16px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
button{font:inherit;color:var(--text-primary);background:transparent;border:0.5px solid var(--border-strong);border-radius:var(--radius);padding:5px 12px;cursor:pointer}
button:hover{background:var(--surface-1)}button:disabled{opacity:.5;cursor:default}
input[type=text],input[type=password],select{font:inherit;color:var(--text-primary);background:var(--surface-2);border:0.5px solid var(--border-strong);border-radius:var(--radius);padding:0 8px;box-sizing:border-box}
code{font-family:var(--font-mono)}
.pt{font-size:13px;line-height:1.5}
.pt .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pt .card{background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:10px 12px;margin:0 0 8px}
.pt .card h4{font-size:13px;font-weight:500;margin:0 0 6px}
.pt .sub{font-size:12px;color:var(--text-secondary)}
.pt .fl{display:block;font-size:12px;color:var(--text-secondary);margin:6px 0 2px}
.pt input[type=text],.pt input[type=password],.pt select{width:100%;height:30px;font-size:12px}
.pt .rd{display:flex;gap:10px;flex-wrap:wrap;font-size:12px}
.pt .rd label{display:flex;gap:4px;align-items:center}
.pt .tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:0.5px solid var(--border);margin:0 0 8px}
.pt .tb{font-size:12px;padding:6px 9px;border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent;color:var(--text-secondary);cursor:pointer}
.pt .tb.on{color:var(--text-primary);border-bottom-color:var(--text-accent)}
.pt .new{font-size:11px;padding:0 5px;border-radius:4px;background:var(--bg-accent);color:var(--text-accent);margin-left:4px}
.pt .step{flex:1;min-width:80px;padding:5px 8px;border-radius:var(--radius);border:0.5px solid var(--border);font-size:12px;color:var(--text-secondary);display:flex;gap:6px;align-items:center}
.pt .step.cur{border-color:var(--border-accent);background:var(--bg-accent);color:var(--text-accent)}
.pt .step.done{color:var(--text-success)}
.pt .step.bad{border-color:var(--text-danger);background:var(--bg-danger);color:var(--text-danger)}
.pt .log{font-family:var(--font-mono);font-size:12px;line-height:1.55;background:var(--surface-1);border-radius:var(--radius);padding:8px 10px;max-height:240px;overflow:auto;white-space:pre-wrap;word-break:break-all}
.pt .ts{color:var(--text-muted);margin-right:8px}
.pt .l-o{color:var(--text-success)}.pt .l-w{color:var(--text-warning)}.pt .l-e{color:var(--text-danger)}.pt .l-p{color:var(--text-secondary)}.pt .l-s{color:var(--text-accent)}
.pt table{width:100%;border-collapse:collapse;font-size:12px}
.pt th{font-weight:500;color:var(--text-secondary);text-align:left;padding:4px 6px;border-bottom:0.5px solid var(--border)}
.pt td{padding:4px 6px;border-bottom:0.5px solid var(--border)}
.pt .ok{color:var(--text-success)}.pt .wn{color:var(--text-warning)}.pt .er{color:var(--text-danger)}.pt .na{color:var(--text-muted)}
.pt .ph{display:flex;gap:8px;align-items:center;padding:4px 0;font-size:12px;color:var(--text-secondary)}
.pt .ph.run{color:var(--text-primary)}.pt .ph.done{color:var(--text-success)}.pt .ph.fail{color:var(--text-danger)}
.pt .chip{font-size:12px;padding:2px 10px;border-radius:var(--radius);border:0.5px solid var(--border);background:transparent;cursor:pointer}
.pt .chip.on{background:var(--bg-accent);color:var(--text-accent);border-color:var(--border-accent)}
.pt .note{font-size:12px;padding:7px 10px;border-radius:var(--radius);margin:6px 0}
.pt .n-i{background:var(--bg-accent);color:var(--text-accent)}.pt .n-w{background:var(--bg-warning);color:var(--text-warning)}.pt .n-e{background:var(--bg-danger);color:var(--text-danger)}.pt .n-s{background:var(--bg-success);color:var(--text-success)}
.pt .kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:3px 10px;font-size:12px}
.pt .kv span:nth-child(odd){color:var(--text-secondary)}
.pt .m{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 8px}
.pt .m div{background:var(--surface-1);border-radius:var(--radius);padding:6px 10px}
.pt .m b{display:block;font-size:18px;font-weight:500}
.pt .stub{border:0.5px dashed var(--border-strong);border-radius:var(--radius);padding:14px;text-align:center;color:var(--text-muted);font-size:12px}
</style>
</head>
<body>
<div class="wrap">
<h2 class="sr-only">安装部署页面原型：保存配置后，在一键部署标签里预检、审批并输入中控机 root 密码，再查看全部部署返回信息</h2>
<div class="pt">
<div class="row" style="justify-content:space-between;margin:0 0 8px">
  <div class="sub"><i class="ti ti-flask" aria-hidden="true"></i> 原型：演示数据，不会执行任何命令。左右分栏、5 张卡片和前 5 个标签沿用现有「安装部署」页；带「新」的是新增部分</div>
  <div class="row"><span class="sub">演示场景</span><select id="sc" style="width:auto"><option value="ok">全部通过</option><option value="precheck">预检失败（缺部署用户）</option><option value="deploy">部署中途失败（SSH 超时）</option></select></div>
</div>

<div class="card" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-color:var(--border-accent)">
  <span class="new" style="margin:0">新</span>
  <span style="font-size:13px">配置：<b id="cfgName" style="font-weight:500">prod-tidb-01</b></span>
  <span id="cfgSt" class="sub"></span>
  <span style="flex:1"></span>
  <button id="bSave"><i class="ti ti-device-floppy" aria-hidden="true"></i> 保存配置</button>
</div>
<div id="saveMsg" class="sub" style="margin:-2px 0 8px"></div>

<div id="grid" style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:10px;align-items:start">
<div id="left">
  <div class="card"><h4>1 · 目标系统与模式</h4>
    <label class="fl">目标操作系统</label><select id="f_os"><option>Rocky Linux 9（glibc 2.34）</option><option>CentOS Stream 9（glibc 2.34）</option><option>Rocky Linux 10（glibc 2.39）</option></select>
    <label class="fl">部署模式</label><div class="rd"><label><input type="radio" name="mode" value="single"> 单机</label><label><input type="radio" name="mode" value="cluster" checked> 多机集群</label></div>
    <label class="fl" for="f_cluster">集群名</label><input type="text" id="f_cluster" value="prod-tidb-01"></div>
  <div class="card"><h4>2 · 操作系统用户</h4>
    <label class="fl" for="f_user">运行 TiUP 与集群的用户（须事先配好）</label><input type="text" id="f_user" value="tidb">
    <div class="row" style="margin-top:6px;flex-wrap:nowrap"><div style="flex:1"><label class="fl" for="f_port">SSH 端口</label><input type="text" id="f_port" value="22"></div><div style="flex:2"><label class="fl" for="f_key">私钥路径（可选）</label><input type="text" id="f_key" placeholder="留空 = ~tidb/.ssh/id_rsa"></div></div></div>
  <div class="card"><h4>3 · TiDB 版本</h4><div class="rd" style="flex-direction:column;gap:4px">
    <label><input type="radio" name="ver" value="auto" checked> 自动（按系统选 v8.5 系列）</label><label><input type="radio" name="ver" value="v8.5"> 指定系列 v8.5</label><label><input type="radio" name="ver" value="v7.5"> 指定系列 v7.5</label></div></div>
  <div class="card"><h4>4 · 安装方式</h4><div class="rd"><label><input type="radio" name="inst" value="online" checked> 在线</label><label><input type="radio" name="inst" value="offline"> 离线</label></div></div>
  <div class="card"><h4>5 · 主机与目录</h4>
    <div id="hSingle" style="display:none"><label class="fl" for="f_single">单机 IP</label><input type="text" id="f_single" value="172.16.0.201"></div>
    <div id="hMulti"><label class="fl" for="f_pd">PD 主机</label><input type="text" id="f_pd" value="172.16.0.201 172.16.0.202 172.16.0.203">
    <label class="fl" for="f_tidb">TiDB 主机</label><input type="text" id="f_tidb" value="172.16.0.201 172.16.0.202">
    <label class="fl" for="f_tikv">TiKV 主机</label><input type="text" id="f_tikv" value="172.16.0.203 172.16.0.204 172.16.0.205">
    <label class="fl" for="f_mon">监控主机</label><input type="text" id="f_mon" value="172.16.0.204"></div>
    <div class="row" style="margin-top:6px;flex-wrap:nowrap"><div style="flex:1"><label class="fl" for="f_dd">部署目录</label><input type="text" id="f_dd" value="/tidb-deploy"></div><div style="flex:1"><label class="fl" for="f_da">数据目录</label><input type="text" id="f_da" value="/tidb-data"></div></div>
    <div class="row" style="margin-top:6px;flex-wrap:nowrap"><div style="flex:1"><label class="fl">规格</label><select id="f_spec"><option value="prod">prod 生产</option><option value="dev">dev 开发测试</option></select></div><div style="flex:1"><label class="fl">防火墙</label><select id="f_fw"><option value="open">只放行 TiDB 端口</option><option value="keep">保持不变</option></select></div></div></div>
</div>

<div id="right" class="card" style="margin:0">
  <div class="tabs" id="tabs"></div>
  <div id="tc"></div>
</div>
</div>

<div id="sumbar" class="card" style="display:none;align-items:center;gap:10px;flex-wrap:wrap;border-color:var(--border-accent)">
  <i class="ti ti-lock" aria-hidden="true"></i><span id="sumTxt" style="flex:1;font-size:12px"></span><button id="bEdit">返回修改配置</button>
</div>
<div id="run" style="display:none"></div>
</div>
</div>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var S={sc:'ok',tab:'conf',saved:null,hist:[],tok:0,pre:[],dep:[],done:[],failIdx:-1,cur:-1,filter:'all',clock:0,appr:false,running:false,rstep:0,rtab:'log',tries:0};
var TABS=[['conf','deploy.conf'],['cmd','命令'],['topo','拓扑预览'],['chk','校验'],['dl','离线包与工具下载'],['run','一键部署']];
var PH=['初始化主机','安装 TiUP','生成拓扑','tiup cluster check','tiup cluster deploy','启动集群','验证'];
var STP=['预检','审批与 root','部署','结果'];
function v(id){return $(id).value.trim()}
function rv(n){var r=document.querySelector('input[name='+n+']:checked');return r?r.value:''}
function hosts(s){return s.replace(/[,;]/g,' ').split(/\s+/).filter(Boolean)}
function isIP(s){return /^(\d{1,3}\.){3}\d{1,3}$/.test(s)&&s.split('.').every(function(x){return +x<=255})}
function allHosts(){var l=rv('mode')==='single'?hosts(v('f_single')):hosts(v('f_pd')).concat(hosts(v('f_tidb')),hosts(v('f_tikv')),hosts(v('f_mon')));return l.filter(function(x,i){return l.indexOf(x)===i})}
function conf(){var m=rv('mode'),L=['# 由「安装部署」页面生成；用法: ./tidb-deploy.sh deploy --config deploy.conf --dry-run','CLUSTER_NAME='+v('f_cluster'),'TIDB_VERSION='+rv('ver'),'DEPLOY_MODE='+m];
 if(m==='single')L.push('SINGLE_HOST="'+v('f_single')+'"');else L.push('PD_HOSTS="'+hosts(v('f_pd')).join(' ')+'"','TIDB_HOSTS="'+hosts(v('f_tidb')).join(' ')+'"','TIKV_HOSTS="'+hosts(v('f_tikv')).join(' ')+'"','MONITOR_HOST="'+hosts(v('f_mon')).join(' ')+'"');
 L.push('','DEPLOY_USER='+v('f_user'),'SSH_PORT='+v('f_port'),'SSH_KEY='+v('f_key'),'DEPLOY_DIR='+v('f_dd'),'DATA_DIR='+v('f_da'),'','SPEC='+v('f_spec'),'FIREWALL='+v('f_fw'),'INSTALL_MODE='+rv('inst'));return L.join('\n')+'\n'}
function valid(){var E=[],W=[],O=[],m=rv('mode');
 if(!/^[A-Za-z0-9][A-Za-z0-9_-]{0,31}$/.test(v('f_cluster')))E.push('集群名只能含字母数字、下划线、连字符，且不超过 32 位');else O.push('集群名合法');
 if(!/^[a-z_][a-z0-9_-]{0,31}$/.test(v('f_user')))E.push('操作系统用户名不合法');else if(v('f_user')==='root')E.push('操作系统用户不能是 root');else O.push('操作系统用户：'+v('f_user'));
 [['部署目录','f_dd'],['数据目录','f_da']].forEach(function(p){if(v(p[1]).charAt(0)!=='/')E.push(p[0]+'必须是绝对路径')});
 var lists=m==='single'?{单机:hosts(v('f_single'))}:{PD:hosts(v('f_pd')),TiDB:hosts(v('f_tidb')),TiKV:hosts(v('f_tikv')),监控:hosts(v('f_mon'))};
 Object.keys(lists).forEach(function(k){lists[k].forEach(function(h){if(!isIP(h))E.push(k+' 的主机「'+h+'」不是合法的 IPv4 地址')})});
 if(m==='cluster'){if(!lists.PD.length)E.push('至少需要 1 台 PD');if(!lists.TiDB.length)E.push('至少需要 1 台 TiDB');if(!lists.TiKV.length)E.push('至少需要 1 台 TiKV');
  if((lists.PD.length<3||lists.TiKV.length<3||lists.TiDB.length<2)&&v('f_spec')==='prod'&&lists.PD.length&&lists.TiDB.length&&lists.TiKV.length)E.push('生产规格要求 PD ≥ 3、TiKV ≥ 3、TiDB ≥ 2（当前 '+lists.PD.length+' / '+lists.TiKV.length+' / '+lists.TiDB.length+'）')}
 W.push('部署前请先在所有机器（含中控机）上配好用户 '+v('f_user')+'：sudo 免密 + 密钥免密 SSH。脚本只检查、不代劳。');
 if(!E.length)O.push('配置通过校验，可以保存');return{E:E,W:W,O:O}}
function hash(s){var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return ('00000000'+h.toString(16)).slice(-8)+'…'}
function dirty(){return !S.saved||S.saved.text!==conf()}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function say(m,bad){$('saveMsg').style.color=bad?'var(--text-danger)':'var(--text-secondary)';$('saveMsg').textContent=m}
function refresh(){var V=valid(),d=dirty();$('cfgName').textContent=v('f_cluster')||'（未命名）';
 $('cfgSt').innerHTML=!S.saved?'<span class="wn"><i class="ti ti-circle-dashed" aria-hidden="true"></i> 尚未保存到平台</span>':(d?'<span class="wn"><i class="ti ti-alert-triangle" aria-hidden="true"></i> 有未保存的修改（最新已保存 v'+S.saved.ver+'）</span>':'<span class="ok"><i class="ti ti-check" aria-hidden="true"></i> 已保存 v'+S.saved.ver+'，与表单一致</span>');
 var h='';TABS.forEach(function(t){var n=t[1];if(t[0]==='chk'&&V.E.length)n+=' · '+V.E.length+' 错误';h+='<button class="tb'+(S.tab===t[0]?' on':'')+'" data-t="'+t[0]+'">'+n+(t[0]==='run'?'<span class="new">新</span>':'')+'</button>'});$('tabs').innerHTML=h;
 [].forEach.call($('tabs').children,function(b){b.onclick=function(){setTab(b.getAttribute('data-t'))}});
 if(S.tab==='conf')$('tc').innerHTML='<div class="row" style="margin-bottom:6px"><button class="chip" id="cpy">复制</button><button class="chip" id="dwn">下载 deploy.conf</button><span class="sub">平台保存的是同一份内容</span></div><div class="log" style="max-height:300px">'+esc(conf())+'</div>';
 else if(S.tab==='chk')$('tc').innerHTML=V.E.map(function(t){return '<div class="note n-e">✖ '+esc(t)+'</div>'}).join('')+V.W.map(function(t){return '<div class="note n-w">⚠ '+esc(t)+'</div>'}).join('')+V.O.map(function(t){return '<div class="note n-s">✔ '+esc(t)+'</div>'}).join('');
 else $('tc').innerHTML='<div class="stub">此标签与现有页面一致，原型从略</div>';
 if($('dwn'))$('dwn').onclick=function(){say('演示：下载 deploy.conf 到本机浏览器（现有功能不变）')};if($('cpy'))$('cpy').onclick=function(){say('演示：已复制')};
 if(S.tab==='run'&&S.rstep===0)renderGate()}
$('bSave').onclick=function(){var V=valid();if(V.E.length){say('存在 '+V.E.length+' 个校验错误，修正后才能保存（见「校验」标签）',true);return}
 if(S.saved&&!dirty()){say('没有变化，仍是 v'+S.saved.ver);return}
 var ver=(S.saved?S.saved.ver:0)+1;S.saved={ver:ver,text:conf(),hash:hash(conf()),at:'21:0'+(3+ver)};S.hist.unshift(S.saved);
 $('saveMsg').style.color='var(--text-success)';$('saveMsg').textContent='已保存为 v'+ver+'（sha256 '+S.saved.hash+'）：写入平台数据目录 deploy/'+v('f_cluster')+'/v'+ver+'.conf，权限 600，记入审计；历史：'+S.hist.slice(0,3).map(function(x){return 'v'+x.ver+' '+x.at}).join(' · ')+'。配置里不含任何密码';refresh()};
document.querySelectorAll('#left input,#left select').forEach(function(e){e.addEventListener('input',onForm);e.addEventListener('change',onForm)});
function onForm(){var s=rv('mode')==='single';$('hSingle').style.display=s?'block':'none';$('hMulti').style.display=s?'none':'block';refresh()}
function setTab(t){S.tab=t;var r=t==='run';$('grid').style.display=r?'none':'grid';$('sumbar').style.display=r?'flex':'none';$('run').style.display=r?'block':'none';
 if(r){$('sumTxt').innerHTML='<b style="font-weight:500">'+esc(v('f_cluster'))+'</b> · '+(rv('mode')==='single'?'单机':'多机')+' · '+rv('ver')+' · '+allHosts().length+' 台主机 · '+(S.saved?'已保存 v'+S.saved.ver:'未保存')+(S.running?'　<span class="wn">部署执行中，配置已锁定</span>':'');$('bEdit').disabled=S.running;renderRun()}
 refresh()}
$('bEdit').onclick=function(){setTab('conf')};
function renderRun(){if(!$('run').innerHTML){$('run').innerHTML='<div class="card" style="padding:8px 12px"><div class="tabs" id="tabs2" style="margin:0;border:0">'+TABS.map(function(t){return '<button class="tb'+(t[0]==='run'?' on':'')+'" data-t="'+t[0]+'">'+t[1]+(t[0]==='run'?'<span class="new">新</span>':'')+'</button>'}).join('')+'</div></div><div id="stp" class="row" style="flex-wrap:nowrap;margin:0 0 8px;display:none"></div><div id="rp0"></div><div id="rp1" style="display:none"></div><div id="rp2" style="display:none"></div><div id="rp3" style="display:none"></div><div id="rp4" style="display:none"></div>';
 [].forEach.call($('tabs2').children,function(b){b.onclick=function(){if(S.running){say('部署执行中，不能切换标签；可以先取消');return}setTab(b.getAttribute('data-t'))}})}
 if(S.rstep===0)renderGate()}
function stepper(bad){var h='';for(var i=1;i<=4;i++){var c=i<S.rstep?'done':(i===S.rstep?(bad?'bad':'cur'):'');var ic=i<S.rstep?'ti-check':(bad&&i===S.rstep?'ti-x':'ti-circle-'+i);h+='<div class="step '+c+'"><i class="ti '+ic+'" aria-hidden="true"></i>'+STP[i-1]+'</div>'}$('stp').innerHTML=h}
